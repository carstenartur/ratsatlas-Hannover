name: Prüfen und veröffentlichen

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ratsatlas-hannover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    name: Anwendung und vollständigen Datenstand prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Vollständigen Datenstand aus dem Archiv bereitstellen
        run: python3 scripts/snapshot_bundle.py unpack
      - name: Browser-Prüfwerkzeug installieren
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript-Tests
        run: npm test
      - name: Import-Tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Gesamten übernommenen Datenstand offline prüfen
        run: python3 scripts/import_unfallwerkbank.py --check --output-dir site/data/ris
      - name: Chromium für die Sichtprüfung installieren
        run: npx playwright install --with-deps chromium
      - name: Echte Daten auf Desktop, Tablet und Telefon prüfen
        run: npm run test:browser
      - name: Browser-Prüfbericht und Bildschirmbilder aufbewahren
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hannover-browser-qa
          path: browser-report
          if-no-files-found: ignore

  pages:
    name: GitHub Pages veröffentlichen
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Geprüften Datenstand aus dem Archiv bereitstellen
        run: python3 scripts/snapshot_bundle.py unpack
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Geprüfte Seite ausliefern
        id: veroeffentlichen
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
